name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run type checking
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Run tests with coverage
      run: npm run test:coverage
      if: matrix.node-version == '22.x'
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.node-version == '22.x'
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Verify build artifacts
      run: |
        test -f dist/index.js
        test -f dist/index.d.ts
        echo "Build artifacts verified successfully"

  lint-fix-check:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check if lint --fix would make changes
      run: |
        npm run lint:fix
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ Code formatting issues found. Please run 'npm run lint:fix' locally and commit the changes."
          git diff
          exit 1
        else
          echo "✅ Code formatting is correct"
        fi

  # Runs on every push to main. Opens or updates the Release PR, which bumps package.json,
  # package-lock.json, and CHANGELOG.md from conventional commits. Merging that PR creates the
  # vX.Y.Z tag and GitHub release. Uses RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN, because PRs opened
  # with GITHUB_TOKEN don't trigger CI and the Release PR's required checks would never report.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: release-please
      cancel-in-progress: false

    steps:
    - name: Run release-please
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
