name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to publish to npm (publish job only)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run type checking
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Run tests with coverage
      run: npm run test:coverage
      if: matrix.node-version == '22.x'
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.node-version == '22.x'
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Verify build artifacts
      run: |
        test -f dist/index.js
        test -f dist/index.d.ts
        echo "Build artifacts verified successfully"

  lint-fix-check:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check if lint --fix would make changes
      run: |
        npm run lint:fix
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ Code formatting issues found. Please run 'npm run lint:fix' locally and commit the changes."
          git diff
          exit 1
        else
          echo "✅ Code formatting is correct"
        fi

  # Runs on every push to main. Opens or updates the Release PR, which bumps package.json,
  # package-lock.json, and CHANGELOG.md from conventional commits. Merging that PR creates the
  # vX.Y.Z tag and GitHub release. Uses RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN, because PRs opened
  # with GITHUB_TOKEN don't trigger CI and the Release PR's required checks would never report.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    concurrency:
      group: release-please
      cancel-in-progress: false

    steps:
    - name: Run release-please
      id: release
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

  # Publishes to npm after a Release PR merges (release_created) or when run manually with a tag.
  # Uses the NPM_TOKEN secret. Provenance requires id-token: write and a public repo.
  publish-npm:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Resolve tag
      id: tag
      env:
        INPUT_TAG: ${{ inputs.tag }}
        RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      run: echo "tag=${INPUT_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"

    - name: Checkout tag
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.tag.outputs.tag }}

    - name: Verify package.json version matches tag
      run: |
        pkg="v$(node -p "require('./package.json').version")"
        if [ "$pkg" != "${{ steps.tag.outputs.tag }}" ]; then
          echo "package.json is $pkg but tag is ${{ steps.tag.outputs.tag }}"
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Publish to npm
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
