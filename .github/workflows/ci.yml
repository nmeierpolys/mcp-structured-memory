name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run type checking
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Run tests with coverage
      run: npm run test:coverage
      if: matrix.node-version == '22.x'
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '22.x'
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build project
      run: npm run build
    
    - name: Verify build artifacts
      run: |
        test -f dist/index.js
        test -f dist/index.d.ts
        echo "Build artifacts verified successfully"

  lint-fix-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check if lint --fix would make changes
      run: |
        npm run lint:fix
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ Code formatting issues found. Please run 'npm run lint:fix' locally and commit the changes."
          git diff
          exit 1
        else
          echo "✅ Code formatting is correct"
        fi

  # Runs only after every required check passes on a push to main (i.e. a merged PR).
  # Tags package.json's version and creates a GitHub release for it. npm publish stays manual.
  release:
    needs: [test, build, lint-fix-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine release action
      id: plan
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG="v$VERSION"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "action=none" >> "$GITHUB_OUTPUT"
          echo "Release $TAG already exists; nothing to do."
        elif git fetch --quiet --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null; then
          # Tag exists without a release, e.g. created by `npm run release:*` on this commit.
          # Release it only when it points here, so historical tags are not backfilled.
          if [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ]; then
            echo "action=release" >> "$GITHUB_OUTPUT"
          else
            echo "action=none" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG points at another commit; not releasing."
          fi
        else
          echo "action=tag-and-release" >> "$GITHUB_OUTPUT"
        fi

    - name: Create and push tag
      if: steps.plan.outputs.action == 'tag-and-release'
      env:
        TAG: ${{ steps.plan.outputs.tag }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
        git push origin "refs/tags/$TAG"

    - name: Create GitHub release
      if: steps.plan.outputs.action != 'none'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ steps.plan.outputs.tag }}
      run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
